name: Fetch WWO Data

on:
  schedule:
    # Run 8 times per day (every 3 hours) at: 12am, 3am, 6am, 9am, 12pm, 3pm, 6pm, 9pm UTC
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Needed so the bot can push the refreshed data back to main.
permissions:
  contents: write

concurrency:
  group: fetch-wwo-data
  cancel-in-progress: false

env:
  SOURCE_URL: https://www.winwithodds.com/download/downloadable_props.csv
  # Reject anything that looks too small to be a real slate of players.
  MIN_ROWS: 100

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Random delay (0-15 minutes)
        run: |
          DELAY=$((RANDOM % 900))
          echo "Waiting ${DELAY} seconds before fetching..."
          sleep $DELAY

      - name: Fetch Win With Odds CSV
        run: |
          set -euo pipefail
          echo "Fetching data from $SOURCE_URL ..."
          # -f: fail on HTTP errors, -L: follow redirects (the site moved to www.),
          # --retry: ride out transient 5xx/network blips.
          curl -fsSL --retry 3 --retry-delay 10 --max-time 120 \
               "$SOURCE_URL" -o props.candidate.csv

      - name: Validate downloaded data
        run: |
          set -euo pipefail

          if [ ! -s props.candidate.csv ]; then
            echo "::error::Download is empty."
            exit 1
          fi

          # Guard against redirect/error pages being saved as "data" — this is what
          # silently broke the feed when the source moved to the www. hostname.
          if head -c 512 props.candidate.csv | grep -qi '<!doctype\|<html'; then
            echo "::error::Downloaded an HTML page, not a CSV. First lines:"
            head -5 props.candidate.csv
            exit 1
          fi

          HEADER=$(head -1 props.candidate.csv)
          case "$HEADER" in
            Player,Pos,*) ;;
            *)
              echo "::error::Unexpected CSV header: $HEADER"
              exit 1
              ;;
          esac

          ROWS=$(($(wc -l < props.candidate.csv) - 1))
          if [ "$ROWS" -lt "$MIN_ROWS" ]; then
            echo "::error::Only $ROWS data rows (expected at least $MIN_ROWS)."
            exit 1
          fi

          echo "Validated: $ROWS data rows"
          echo "Header: $HEADER"
          echo "ROW_COUNT=$ROWS" >> "$GITHUB_ENV"

      - name: Promote validated data
        run: |
          set -euo pipefail
          mv props.candidate.csv props.csv

          cat > metadata.json <<EOF
          {
            "last_updated": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "source": "$SOURCE_URL",
            "row_count": $ROW_COUNT
          }
          EOF

          cat metadata.json

      - name: Commit and push if changes
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add props.csv metadata.json

          # metadata.json always changes (timestamp), so only commit when the
          # actual data moved — otherwise we'd push 8 empty updates a day.
          if git diff --staged --quiet -- props.csv; then
            echo "props.csv unchanged - nothing to commit"
            git reset
          else
            git commit -m "Update props data - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git push
          fi
