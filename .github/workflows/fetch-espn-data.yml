name: Fetch ESPN Projections

on:
  schedule:
    # Offset from the props job so the two do not race for a push.
    - cron: '30 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-push
  cancel-in-progress: false

jobs:
  fetch-espn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and slim ESPN projections
        run: python scripts/fetch_espn.py

      - name: Validate output
        run: |
          set -euo pipefail

          head -1 espn_projections.csv
          ROWS=$(($(wc -l < espn_projections.csv) - 1))
          echo "rows: $ROWS"

          if [ "$ROWS" -lt 200 ]; then
            echo "::error::Only $ROWS rows (expected at least 200)."
            exit 1
          fi

      - name: Commit and push if changes
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add espn_projections.csv espn_metadata.json

          if git diff --staged --quiet -- espn_projections.csv; then
            echo "espn_projections.csv unchanged - nothing to commit"
            git reset
          else
            git commit -m "Update ESPN projections - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git pull --rebase origin main
            git push
          fi
